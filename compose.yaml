services:
  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/intelligence
      AUTO_CREATE_SCHEMA: "false"
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn open_data_intelligence.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: intelligence
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d intelligence"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

